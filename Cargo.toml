[package]
name = "syswatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast, lightweight native terminal system monitor for Linux"
readme = "README.md"
license = "MIT"
keywords = ["tui", "monitor", "system", "linux", "ratatui"]
categories = ["command-line-utilities", "visualization"]
repository = "https://github.com/Rayuga/VirSys"
exclude = ["/target", "/.github", "/config", "/scripts"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.180"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "user"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = [
    "system",
    "disk",
    "component",
    "network",
    "user",
] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 1
